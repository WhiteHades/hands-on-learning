name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make pkg-config libncurses-dev libjson-c-dev libcurl4-openssl-dev bat
      - name: Build and test
        run: make check
      - name: Validate the demo course
        run: build/hands-on-learning validate courses/demo.holcourse
      - name: Run sanitizers
        run: make sanitize
